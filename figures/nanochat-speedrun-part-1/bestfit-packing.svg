<svg xmlns="http://www.w3.org/2000/svg" width="620" height="286" viewBox="0 0 620 286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="BOS-aligned best-fit packing: documents placed whole until none fits, then one document cropped to fill the row exactly.">
<rect width="620" height="286" fill="#333333"/>
<text x="28" y="22" font-size="15" fill="#DDDDDD">Every row comes out <tspan fill="#F0AC5F" font-weight="600">exactly full</tspan> — which is only possible if something gets cropped</text>
<text x="28.0" y="42.0" font-size="11" fill="#888888" text-anchor="start">row capacity = T + 1 = 2,049 tokens, not 2,048: inputs and targets are the same row offset by one</text>
<rect x="28.0" y="74.0" width="478.0" height="26.0" rx="3" fill="#3d3d3d"/>
<rect x="28.0" y="74.0" width="274.6" height="26.0" rx="3" fill="#58C4DD"/>
<rect x="28.0" y="74.0" width="2.0" height="26.0" rx="0" fill="#DDDDDD"/>
<text x="165.3" y="91.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177</text>
<text x="28.0" y="67.0" font-size="11" fill="#888888" text-anchor="start">1. largest that fits in 2,049: 1,177</text>
<rect x="28.0" y="122.0" width="478.0" height="26.0" rx="3" fill="#3d3d3d"/>
<rect x="28.0" y="122.0" width="274.6" height="26.0" rx="3" fill="#58C4DD"/>
<rect x="28.0" y="122.0" width="2.0" height="26.0" rx="0" fill="#DDDDDD"/>
<text x="165.3" y="139.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177</text>
<rect x="302.6" y="122.0" width="140.4" height="26.0" rx="3" fill="#5CD0B3"/>
<rect x="302.6" y="122.0" width="2.0" height="26.0" rx="0" fill="#DDDDDD"/>
<text x="372.8" y="139.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">602</text>
<text x="28.0" y="115.0" font-size="11" fill="#888888" text-anchor="start">2. largest that fits in 872: 602</text>
<rect x="28.0" y="170.0" width="478.0" height="26.0" rx="3" fill="#3d3d3d"/>
<rect x="28.0" y="170.0" width="274.6" height="26.0" rx="3" fill="#58C4DD"/>
<rect x="28.0" y="170.0" width="2.0" height="26.0" rx="0" fill="#DDDDDD"/>
<text x="165.3" y="187.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177</text>
<rect x="302.6" y="170.0" width="140.4" height="26.0" rx="3" fill="#5CD0B3"/>
<rect x="302.6" y="170.0" width="2.0" height="26.0" rx="0" fill="#DDDDDD"/>
<text x="372.8" y="187.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">602</text>
<rect x="443.0" y="170.0" width="63.0" height="26.0" rx="3" fill="#F0AC5F"/>
<rect x="443.0" y="170.0" width="2.0" height="26.0" rx="0" fill="#DDDDDD"/>
<text x="474.5" y="187.0" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">270</text>
<rect x="513.0" y="177.0" width="61.4" height="12.0" rx="2" fill="#FC6255" opacity="0.4"/>
<text x="513.0" y="208.0" font-size="11" fill="#FC6255" text-anchor="start">263 discarded</text>
<text x="28.0" y="163.0" font-size="11" fill="#888888" text-anchor="start">3. nothing fits 270 — crop the shortest</text>
<line x1="28.0" y1="220.0" x2="592.0" y2="220.0" stroke="#736357" stroke-width="1" opacity="0.4"/>
<text x="28" y="240" font-size="11" fill="#888888"><tspan font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177 + 602 + 270 = 2,049</tspan> — no padding, so every token is trained on</text>
<text x="28.0" y="258.0" font-size="11" fill="#736357" text-anchor="start">The cropped document is always the shortest in the buffer, which minimises what is thrown away at that step.</text>
</svg>