<svg xmlns="http://www.w3.org/2000/svg" width="640" height="278" viewBox="0 0 640 278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="One optimizer step across four ranks. Gradients stay local through eight accumulation steps, then reduce-scatter, local update and all-gather.">
<rect width="640" height="278" fill="#333333"/>
<text x="28" y="22" font-size="15" fill="#DDDDDD">The model is never DDP-wrapped — <tspan fill="#F0AC5F" font-weight="600">the optimizer owns synchronisation</tspan></text>
<text x="28.0" y="40.0" font-size="11" fill="#888888" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">4 ranks x 16 x 2,048 tokens x 8 accumulation steps = 1,048,576 tokens per step</text>
<text x="205.0" y="68.0" font-size="11" fill="#58C4DD" text-anchor="middle" font-weight="600">forward + backward</text>
<text x="386.5" y="56.0" font-size="11" fill="#9A72AC" text-anchor="middle" font-weight="600">reduce_scatter</text>
<text x="474.5" y="68.0" font-size="11" fill="#F0AC5F" text-anchor="middle" font-weight="600">local update</text>
<text x="568.0" y="56.0" font-size="11" fill="#9A72AC" text-anchor="middle" font-weight="600">all_gather</text>
<text x="53.0" y="97.0" font-size="11" fill="#888888" text-anchor="end">rank 0</text>
<rect x="63.0" y="82.0" width="284.0" height="22.0" rx="4" fill="#58C4DD"/>
<rect x="349.0" y="82.0" width="75.0" height="22.0" rx="4" fill="#9A72AC"/>
<rect x="426.0" y="82.0" width="97.0" height="22.0" rx="4" fill="#F0AC5F"/>
<rect x="525.0" y="82.0" width="86.0" height="22.0" rx="4" fill="#9A72AC"/>
<text x="53.0" y="125.0" font-size="11" fill="#888888" text-anchor="end">rank 1</text>
<rect x="63.0" y="110.0" width="284.0" height="22.0" rx="4" fill="#58C4DD"/>
<rect x="349.0" y="110.0" width="75.0" height="22.0" rx="4" fill="#9A72AC"/>
<rect x="426.0" y="110.0" width="97.0" height="22.0" rx="4" fill="#F0AC5F"/>
<rect x="525.0" y="110.0" width="86.0" height="22.0" rx="4" fill="#9A72AC"/>
<text x="53.0" y="153.0" font-size="11" fill="#888888" text-anchor="end">rank 2</text>
<rect x="63.0" y="138.0" width="284.0" height="22.0" rx="4" fill="#58C4DD"/>
<rect x="349.0" y="138.0" width="75.0" height="22.0" rx="4" fill="#9A72AC"/>
<rect x="426.0" y="138.0" width="97.0" height="22.0" rx="4" fill="#F0AC5F"/>
<rect x="525.0" y="138.0" width="86.0" height="22.0" rx="4" fill="#9A72AC"/>
<text x="53.0" y="181.0" font-size="11" fill="#888888" text-anchor="end">rank 3</text>
<rect x="63.0" y="166.0" width="284.0" height="22.0" rx="4" fill="#58C4DD"/>
<rect x="349.0" y="166.0" width="75.0" height="22.0" rx="4" fill="#9A72AC"/>
<rect x="426.0" y="166.0" width="97.0" height="22.0" rx="4" fill="#F0AC5F"/>
<rect x="525.0" y="166.0" width="86.0" height="22.0" rx="4" fill="#9A72AC"/>
<line x1="348.0" y1="72.0" x2="348.0" y2="198.0" stroke="#DDDDDD" stroke-width="2" stroke-dasharray="4 4"/>
<text x="28.0" y="214.0" font-size="11" fill="#DDDDDD" text-anchor="start">an ordinary DDP model would already be all-reducing at the dashed line</text>
<line x1="28.0" y1="230.0" x2="612.0" y2="230.0" stroke="#736357" stroke-width="1" opacity="0.4"/>
<text x="28" y="250" font-size="11" fill="#888888"><tspan fill="#9A72AC">communication</tspan> is an explicit async phase; <tspan fill="#F0AC5F">each rank updates only its own shard</tspan>, so optimizer state is never duplicated</text>
</svg>