<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="BOS-aligned best-fit packing: documents placed whole until none fits, then one document cropped to fill the row exactly.">
<rect width="900" height="410" fill="#333333"/>
<text x="40" y="30" font-size="17" fill="#DDDDDD">Every row comes out <tspan fill="#F0AC5F" font-weight="600">exactly full</tspan> — which is only possible if something gets cropped</text>
<text x="40.0" y="58.0" font-size="13" fill="#888888" text-anchor="start">row capacity = T + 1 = 2,049 tokens, not 2,048: inputs and targets are the same row offset by one</text>
<rect x="40.0" y="96.0" width="700.0" height="44.0" rx="3" fill="#3d3d3d"/>
<rect x="40.0" y="96.0" width="402.1" height="44.0" rx="3" fill="#58C4DD"/>
<rect x="40.0" y="96.0" width="3.0" height="44.0" rx="0" fill="#DDDDDD"/>
<text x="241.0" y="123.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177</text>
<text x="40.0" y="87.0" font-size="13" fill="#888888" text-anchor="start">1. largest that fits in 2,049: 1,177</text>
<rect x="40.0" y="170.0" width="700.0" height="44.0" rx="3" fill="#3d3d3d"/>
<rect x="40.0" y="170.0" width="402.1" height="44.0" rx="3" fill="#58C4DD"/>
<rect x="40.0" y="170.0" width="3.0" height="44.0" rx="0" fill="#DDDDDD"/>
<text x="241.0" y="197.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177</text>
<rect x="442.1" y="170.0" width="205.7" height="44.0" rx="3" fill="#5CD0B3"/>
<rect x="442.1" y="170.0" width="3.0" height="44.0" rx="0" fill="#DDDDDD"/>
<text x="544.9" y="197.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">602</text>
<text x="40.0" y="161.0" font-size="13" fill="#888888" text-anchor="start">2. largest that fits in 872: 602</text>
<rect x="40.0" y="244.0" width="700.0" height="44.0" rx="3" fill="#3d3d3d"/>
<rect x="40.0" y="244.0" width="402.1" height="44.0" rx="3" fill="#58C4DD"/>
<rect x="40.0" y="244.0" width="3.0" height="44.0" rx="0" fill="#DDDDDD"/>
<text x="241.0" y="271.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177</text>
<rect x="442.1" y="244.0" width="205.7" height="44.0" rx="3" fill="#5CD0B3"/>
<rect x="442.1" y="244.0" width="3.0" height="44.0" rx="0" fill="#DDDDDD"/>
<text x="544.9" y="271.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">602</text>
<rect x="647.8" y="244.0" width="92.2" height="44.0" rx="3" fill="#F0AC5F"/>
<rect x="647.8" y="244.0" width="3.0" height="44.0" rx="0" fill="#DDDDDD"/>
<text x="693.9" y="271.0" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">270</text>
<rect x="750.0" y="255.0" width="89.8" height="22.0" rx="2" fill="#FC6255" opacity="0.4"/>
<text x="750.0" y="304.0" font-size="13" fill="#FC6255" text-anchor="start">263 discarded</text>
<text x="40.0" y="235.0" font-size="13" fill="#888888" text-anchor="start">3. nothing fits 270 — crop the shortest</text>
<line x1="40.0" y1="320.0" x2="860.0" y2="320.0" stroke="#736357" stroke-width="1" opacity="0.4"/>
<text x="40" y="348" font-size="14" fill="#888888"><tspan font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">1,177 + 602 + 270 = 2,049</tspan> — no padding, so every token is trained on</text>
<text x="40.0" y="372.0" font-size="13" fill="#736357" text-anchor="start">The cropped document is always the shortest in the buffer, which minimises what is thrown away at that step.</text>
</svg>