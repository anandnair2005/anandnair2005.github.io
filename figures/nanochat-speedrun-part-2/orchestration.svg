<svg xmlns="http://www.w3.org/2000/svg" width="825" height="468" viewBox="0 0 660 374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The orchestration: a local driver, an ephemeral rented host that does the compute, and cloud storage as the durable layer. Results are synced off the host continuously.">
<rect width="660" height="374" fill="#333333"/>
<text x="28" y="24" font-size="15" fill="#DDDDDD">Only the middle column is <tspan fill="#FC6255" font-weight="600">disposable</tspan></text>
<text x="28.0" y="44.0" font-size="11" fill="#888888" text-anchor="start">so results have to leave it while the run is still going</text>
