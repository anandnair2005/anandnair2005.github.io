<text x="254.0" y="114.0" font-size="13" fill="#F0AC5F" text-anchor="start" font-weight="600">Vast.ai host</text>
<text x="254.0" y="130.0" font-size="11" fill="#888888" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">4 x H100</text>
