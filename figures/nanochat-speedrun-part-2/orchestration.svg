<text x="437.0" y="129.0" font-size="11" fill="#F0AC5F" text-anchor="middle" font-weight="600">sync</text>
<text x="437.0" y="152.0" font-size="11" fill="#F0AC5F" text-anchor="middle">continuous, everything</text>
<line x1="28.0" y1="326.0" x2="632.0" y2="326.0" stroke="#736357" stroke-width="1" opacity="0.4"/>
<text x="28.0" y="340.0" font-size="11" fill="#736357" text-anchor="start">One run: 4h 36m wall clock, $41.16 of rented time.</text>
<text x="28.0" y="356.0" font-size="11" fill="#888888" text-anchor="start">A host lost mid-run costs the hours since the last sync, not the run.</text>
