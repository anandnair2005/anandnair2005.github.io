<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="426" viewBox="0 0 1000 426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="One optimizer step across four ranks. Gradients stay local through eight accumulation steps, then reduce-scatter, local update and all-gather.">
<rect width="1000" height="426" fill="#333333"/>
<text x="40" y="30" font-size="17" fill="#DDDDDD">The model is never DDP-wrapped — <tspan fill="#F0AC5F" font-weight="600">the optimizer owns synchronisation</tspan></text>
<text x="40.0" y="56.0" font-size="13" fill="#888888" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace">4 ranks x 16 x 2,048 tokens x 8 accumulation steps = 1,048,576 tokens per step</text>
<text x="320.6" y="88.0" font-size="13" fill="#58C4DD" text-anchor="middle" font-weight="600">forward + backward</text>
<text x="605.8" y="88.0" font-size="13" fill="#9A72AC" text-anchor="middle" font-weight="600">reduce_scatter</text>
<text x="744.0" y="88.0" font-size="13" fill="#F0AC5F" text-anchor="middle" font-weight="600">local update</text>
<text x="890.9" y="88.0" font-size="13" fill="#9A72AC" text-anchor="middle" font-weight="600">all_gather</text>
<text x="82.0" y="133.0" font-size="13" fill="#888888" text-anchor="end">rank 0</text>
<rect x="97.0" y="108.0" width="447.3" height="40.0" rx="4" fill="#58C4DD"/>
<rect x="546.3" y="108.0" width="119.0" height="40.0" rx="4" fill="#9A72AC"/>
<rect x="667.2" y="108.0" width="153.5" height="40.0" rx="4" fill="#F0AC5F"/>
<rect x="822.8" y="108.0" width="136.2" height="40.0" rx="4" fill="#9A72AC"/>
<text x="82.0" y="183.0" font-size="13" fill="#888888" text-anchor="end">rank 1</text>
<rect x="97.0" y="158.0" width="447.3" height="40.0" rx="4" fill="#58C4DD"/>
<rect x="546.3" y="158.0" width="119.0" height="40.0" rx="4" fill="#9A72AC"/>
<rect x="667.2" y="158.0" width="153.5" height="40.0" rx="4" fill="#F0AC5F"/>
<rect x="822.8" y="158.0" width="136.2" height="40.0" rx="4" fill="#9A72AC"/>
<text x="82.0" y="233.0" font-size="13" fill="#888888" text-anchor="end">rank 2</text>
<rect x="97.0" y="208.0" width="447.3" height="40.0" rx="4" fill="#58C4DD"/>
<rect x="546.3" y="208.0" width="119.0" height="40.0" rx="4" fill="#9A72AC"/>
<rect x="667.2" y="208.0" width="153.5" height="40.0" rx="4" fill="#F0AC5F"/>
<rect x="822.8" y="208.0" width="136.2" height="40.0" rx="4" fill="#9A72AC"/>
<text x="82.0" y="283.0" font-size="13" fill="#888888" text-anchor="end">rank 3</text>
<rect x="97.0" y="258.0" width="447.3" height="40.0" rx="4" fill="#58C4DD"/>
<rect x="546.3" y="258.0" width="119.0" height="40.0" rx="4" fill="#9A72AC"/>
<rect x="667.2" y="258.0" width="153.5" height="40.0" rx="4" fill="#F0AC5F"/>
<rect x="822.8" y="258.0" width="136.2" height="40.0" rx="4" fill="#9A72AC"/>
<line x1="545.3" y1="94.0" x2="545.3" y2="314.0" stroke="#DDDDDD" stroke-width="2" stroke-dasharray="4 4"/>
<text x="555.3" y="334.0" font-size="13" fill="#DDDDDD" text-anchor="start">an ordinary DDP model would already be all-reducing, here</text>
<line x1="40.0" y1="356.0" x2="960.0" y2="356.0" stroke="#736357" stroke-width="1" opacity="0.4"/>
<text x="40" y="382" font-size="14" fill="#888888"><tspan fill="#9A72AC">communication</tspan> is an explicit async phase; <tspan fill="#F0AC5F">each rank updates only its own shard</tspan>, so optimizer state is never duplicated</text>
</svg>