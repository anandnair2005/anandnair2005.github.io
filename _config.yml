title: Anand Nair
tagline: An exploration into the magical world of AI and software technology
description: >-
  Deep dives into AI and software systems: training runs, GPU internals,
  and the engineering underneath.
author: Anand Nair
url: https://anandnair.dev
baseurl: ""

# Where syndicated copies live. Referenced in the footer only.
medium_publication: https://medium.com/indistinguishable-from-magic-ai
github_username: anandnair2005

permalink: /posts/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - preview-*.html
  # Figure infrastructure and tooling live beside the figures but are not part
  # of the site. The per-post generators are deliberately NOT excluded: they
  # assert their numbers against the run log, and being able to read them is
  # what makes the figures auditable.
  - figures/figlib.py
  - figures/figtools.py
  - "figures/*/build_all.py"
  - "figures/*/export_png.py"
  - "figures/*/export-png.html"
  - "figures/*/png-export-prompt.md"
  - "**/__pycache__"
